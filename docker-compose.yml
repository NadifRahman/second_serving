services:
  db:
    image: postgis/postgis:16-3.5
    container_name: secondserving-db
    environment:
      POSTGRES_DB: secondserving
      POSTGRES_USER: secondserving
      POSTGRES_PASSWORD: secondserving
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data: