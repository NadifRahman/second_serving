services:
  db:
    image: postgis/postgis:16-3.5
    container_name: secondserving-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432" # Access from VPS localhost only
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: ./backend
    container_name: secondserving-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SERVER_PORT: ${SERVER_PORT:-8080} # what port spring will use inside the container
      DB_HOST: db # how spring will connect to the db container, this should match the service name in docker compose
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:-Zm9yLWRldi1vbmx5LXVzZS1hLWxvbmctcmFuZG9tLWJhc2U2NC1zZWNyZXQtdmFsdWUtaGVyZQ==}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      JWT_COOKIE_NAME: ${JWT_COOKIE_NAME:-access_token}
      JWT_COOKIE_SECURE: ${JWT_COOKIE_SECURE:-false}
      JWT_COOKIE_SAME_SITE: ${JWT_COOKIE_SAME_SITE:-Lax}
    ports:
      - "127.0.0.1:${APP_PORT:-18080}:${SERVER_PORT:-8080}" # map VPS port to container port, only on localhost for security

  nginx:
    image: nginx:1.27-alpine
    container_name: secondserving-nginx
    depends_on:
      - app
    environment:
      SERVER_PORT: ${SERVER_PORT:-8080} # Port of the spring boot inside docker network
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro # server block template with env vars
      - ./frontend/dist:/usr/share/nginx/html:ro # serve built frontend assets from vite
      - ./certs:/etc/nginx/certs:ro # TLS certificates for HTTPS

volumes:
  db_data:
