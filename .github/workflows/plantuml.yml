name: Render PlantUML

on:
  push:
    paths:
      - "**/*.puml"

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Render PlantUML diagrams
        uses: Timmy/plantuml-action@v1
        with:
          args: -v -tsvg docs/diagrams/*.puml
